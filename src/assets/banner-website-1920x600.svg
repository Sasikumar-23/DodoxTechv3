    <ellipse cx="0" cy="0" rx="320" ry="320" fill="url(#eclipseAura)"/>
    <!-- Corona rays -->
    <g stroke="#E8E0CC" stroke-linecap="round">
      <line x1="0" y1="-210" x2="0" y2="-260" stroke-width="2" opacity="0.8"/>
      <line x1="0" y1="210" x2="0" y2="260" stroke-width="2" opacity="0.8"/>
      <line x1="210" y1="0" x2="260" y2="0" stroke-width="2" opacity="0.8"/>
      <line x1="-210" y1="0" x2="-260" y2="0" stroke-width="2" opacity="0.8"/>
      <line x1="148" y1="-148" x2="184" y2="-184" stroke-width="2" opacity="0.8"/>
      <line x1="-148" y1="-148" x2="-184" y2="-184" stroke-width="2" opacity="0.8"/>
      <line x1="148" y1="148" x2="184" y2="184" stroke-width="2" opacity="0.8"/>
      <line x1="-148" y1="148" x2="-184" y2="184" stroke-width="2" opacity="0.8"/>
      <line x1="90" y1="-192" x2="110" y2="-236" stroke-width="1.2" opacity="0.5"/>
      <line x1="-90" y1="-192" x2="-110" y2="-236" stroke-width="1.2" opacity="0.5"/>
      <line x1="90" y1="192" x2="110" y2="236" stroke-width="1.2" opacity="0.5"/>
      <line x1="-90" y1="192" x2="-110" y2="236" stroke-width="1.2" opacity="0.5"/>
      <line x1="192" y1="-90" x2="236" y2="-110" stroke-width="1.2" opacity="0.5"/>
      <line x1="-192" y1="-90" x2="-236" y2="-110" stroke-width="1.2" opacity="0.5"/>
      <line x1="192" y1="90" x2="236" y2="110" stroke-width="1.2" opacity="0.5"/>
      <line x1="-192" y1="90" x2="-236" y2="110" stroke-width="1.2" opacity="0.5"/>
      <!-- Tertiary fine rays -->
      <line x1="45" y1="-206" x2="52" y2="-248" stroke-width="0.8" opacity="0.3"/>
      <line x1="-45" y1="-206" x2="-52" y2="-248" stroke-width="0.8" opacity="0.3"/>
      <line x1="206" y1="-45" x2="248" y2="-52" stroke-width="0.8" opacity="0.3"/>
      <line x1="-206" y1="-45" x2="-248" y2="-52" stroke-width="0.8" opacity="0.3"/>
      <line x1="45" y1="206" x2="52" y2="248" stroke-width="0.8" opacity="0.3"/>
      <line x1="-45" y1="206" x2="-52" y2="248" stroke-width="0.8" opacity="0.3"/>
      <line x1="206" y1="45" x2="248" y2="52" stroke-width="0.8" opacity="0.3"/>
      <line x1="-206" y1="45" x2="-248" y2="52" stroke-width="0.8" opacity="0.3"/>
    </g>
    <circle cx="0" cy="0" r="202" fill="none" stroke="#E8E0CC" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="194" fill="#0c0c12"/>
    <circle cx="0" cy="0" r="194" fill="none" stroke="#E8E0CC" stroke-width="2.5" opacity="0.4"/>
    <!-- Moon disc -->
    <circle cx="38" cy="-28" r="186" fill="#07070A"/>
    <!-- Eclipse ring -->
    <circle cx="0" cy="0" r="194" fill="none" stroke="#F5F0E8" stroke-width="3" opacity="0.95"/>
    <!-- Crescent highlight -->
    <path d="M -136 -142 A 194 194 0 0 1 148 -138" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Right side TEXT block -->
  <g transform="translate(960,0)">
    <!-- Thin top rule -->
    <line x1="0" y1="155" x2="900" y2="155" stroke="#1e1e1e" stroke-width="0.5"/>
    <text x="0" y="148" font-family="'Arial', sans-serif" font-size="14" fill="#5a5040" letter-spacing="6">COIMBATORE · INDIA · 2026</text>

    <text x="0" y="260" font-family="'Georgia', serif" font-size="88" font-weight="400" fill="#F5F0E8" letter-spacing="3">DODOX</text>
    <text x="0" y="355" font-family="'Georgia', serif" font-size="88" font-weight="400" fill="#9A9080" letter-spacing="3">TECHS</text>

    <text x="4" y="408" font-family="'Arial', sans-serif" font-size="18" font-weight="300" fill="#5a5040" letter-spacing="18">STUDIO</text>

    <!-- Bottom rule + tagline -->
    <line x1="0" y1="445" x2="900" y2="445" stroke="#1e1e1e" stroke-width="0.5"/>
    <text x="0" y="472" font-family="'Arial', sans-serif" font-size="16" fill="#3a3028" letter-spacing="5">BUILD SMARTER · GROW FASTER</text>
    <text x="880" y="472" text-anchor="end" font-family="'Arial', sans-serif" font-size="13" fill="#2a2a2a" letter-spacing="2">dodoxtechs.in</text>
  </g>
