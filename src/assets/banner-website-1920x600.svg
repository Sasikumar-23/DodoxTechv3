<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07070A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eclipseAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F0E8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BG -->
  <rect width="1920" height="600" fill="#07070A"/>
  <rect width="1920" height="600" fill="url(#heroGlow)"/>

  <!-- Subtle star field -->
  <circle cx="900" cy="80" r="1" fill="#F5F0E8" opacity="0.3"/>
  <circle cx="1400" cy="120" r="1.5" fill="#F5F0E8" opacity="0.2"/>
  <circle cx="1650" cy="200" r="1" fill="#F5F0E8" opacity="0.25"/>
  <circle cx="1750" cy="450" r="1" fill="#F5F0E8" opacity="0.2"/>
  <circle cx="1200" cy="500" r="1.5" fill="#F5F0E8" opacity="0.15"/>
  <circle cx="600" cy="500" r="1" fill="#F5F0E8" opacity="0.2"/>
  <circle cx="300" cy="150" r="1" fill="#F5F0E8" opacity="0.15"/>
  <circle cx="1850" cy="350" r="1" fill="#F5F0E8" opacity="0.2"/>
  <circle cx="100" cy="400" r="1.5" fill="#F5F0E8" opacity="0.1"/>
  <circle cx="1550" cy="80" r="1" fill="#F5F0E8" opacity="0.2"/>

  <!-- Large eclipse centerpiece LEFT area -->
