<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background transparent -->
  <rect width="600" height="160" fill="transparent" />

  <!-- Eclipse symbol left -->
  <g transform="translate(80,80)" filter="url(#glow)">
    <!-- Corona rays -->
    <line x1="0" y1="-58" x2="0" y2="-72" stroke="#E8E0C8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="58" x2="0" y2="72" stroke="#E8E0C8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="58" y1="0" x2="72" y2="0" stroke="#E8E0C8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="-58" y1="0" x2="-72" y2="0" stroke="#E8E0C8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="41" y1="-41" x2="51" y2="-51" stroke="#E8E0C8" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <line x1="-41" y1="-41" x2="-51" y2="-51" stroke="#E8E0C8" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <line x1="41" y1="41" x2="51" y2="51" stroke="#E8E0C8" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <line x1="-41" y1="41" x2="-51" y2="51" stroke="#E8E0C8" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <line x1="23" y1="-54" x2="29" y2="-67" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-23" y1="-54" x2="-29" y2="-67" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="23" y1="54" x2="29" y2="67" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-23" y1="54" x2="-29" y2="67" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="54" y1="23" x2="67" y2="29" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-54" y1="23" x2="-67" y2="29" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="54" y1="-23" x2="67" y2="-29" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-54" y1="-23" x2="-67" y2="-29" stroke="#C8C0A8" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <!-- Sun ring -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#E8E0C8" stroke-width="1.5" opacity="0.6"/>
    <!-- Moon -->
    <circle cx="11" cy="-8" r="51" fill="#07070A"/>
    <circle cx="11" cy="-8" r="51" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    <!-- Platinum crescent edge -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#E8E0C8" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="158" y="72" font-family="'Georgia', 'Times New Roman', serif" font-size="36" font-weight="700" fill="#E8E0C8" letter-spacing="3">DODOXTECHS</text>
  <!-- Thin divider line -->
  <line x1="158" y1="82" x2="570" y2="82" stroke="#3a3830" stroke-width="0.5"/>
  <!-- Studio tag -->
  <text x="160" y="100" font-family="'Arial', sans-serif" font-size="12" font-weight="400" fill="#888070" letter-spacing="10">S T U D I O</text>
  <!-- Tagline -->
  <text x="160" y="122" font-family="'Arial', sans-serif" font-size="9" fill="#3a3830" letter-spacing="4">BUILD SMARTER · GROW FASTER</text>
</svg>
